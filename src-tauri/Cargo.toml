[package]
name = "jsa-app"
version = "1.1.0"
description = "JSA Channels - app desktop Windows/Mac"
authors = ["JSA DJ's Team"]
edition = "2021"

[lib]
name = "jsa_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
